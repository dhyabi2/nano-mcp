name: test

# This repository had no workflows at all, so its 189 tests had never once run on
# a runner - on any commit, in any pull request. What that hid is the reason this
# file exists rather than a tidying-up.
#
# `pyproject.toml` declared `mcp>=1.0` while the server imports
# `mcp.server.mcpserver`, a module that exists only from mcp 2.0.0. Any install
# that resolved to a 1.x - and in an environment already holding one, `pip
# install -e ".[dev]"` resolved to exactly that and changed nothing - produced a
# package whose entry point raised ModuleNotFoundError. Seven of the twenty-one
# test files import the server, so they failed at *collection*: `125 tests
# collected, 7 errors` where the suite is 189. A count of passing tests cannot
# tell "not run" from "not there".
#
# So the install step here is deliberately `pip install -e ".[dev]"` - the
# declared dependencies, resolved from scratch, the same command the README
# gives - and not a pinned list. Pinning the runner's versions would have made
# this workflow green on the very commit whose declaration could not start the
# server.
#
# The `floor` job exists for the other direction: the matrix above resolves to
# the newest mcp, which says nothing about the lowest version the package claims
# to accept. It reads the floor out of pyproject.toml rather than repeating it,
# so the declaration and the thing being tested cannot drift apart.
#
# Network is deselected by the repository's own `network` marker, so nothing here
# touches rpc.nano.to.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from the declared dependencies
        run: pip install -e ".[dev]"

      - name: Offline suite
        run: python -m pytest -q -m "not network"

      # What a directory does on first contact: install from a clean clone, start
      # the server with no configuration, ask for the tool list. server_from_env
      # is documented to work unconfigured, and this is the step that would have
      # been red for the whole life of the `mcp>=1.0` declaration.
      - name: The server starts unconfigured and lists its tools
        run: |
          python - <<'PY'
          import asyncio
          from nano_mcp.server import server_from_env

          server = server_from_env()
          tools = asyncio.run(server.list_tools())
          names = sorted(tool.name for tool in tools)
          print(f"{server.name} exposes {len(names)}: {names}")
          assert names, "the server started but exposes no tools"
          PY

  floor:
    name: the declared mcp floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The lowest interpreter requires-python admits, paired with the lowest
          # mcp the dependency admits: the oldest install the package claims.
          python-version: "3.10"

      - name: Install from the declared dependencies
        run: pip install -e ".[dev]"

      - name: Pin mcp down to the declared floor
        run: |
          floor=$(python - <<'PY'
          from packaging.requirements import Requirement
          from setuptools.config.pyprojecttoml import apply_configuration
          from setuptools.dist import Distribution

          dist = apply_configuration(Distribution(), "pyproject.toml")
          mcp = next(r for r in map(Requirement, dist.install_requires) if r.name == "mcp")
          lowest = sorted(s.version for s in mcp.specifier if s.operator in (">=", "==", "~="))
          assert lowest, f"mcp{mcp.specifier} states no lower bound to test"
          print(lowest[0])
          PY
          )
          echo "declared floor: mcp==$floor"
          pip install "mcp==$floor"

      - name: Offline suite at the floor
        run: python -m pytest -q -m "not network"

      - name: The server starts unconfigured at the floor
        run: |
          python - <<'PY'
          import asyncio
          from nano_mcp.server import server_from_env

          tools = asyncio.run(server_from_env().list_tools())
          assert tools, "the server started but exposes no tools"
          print(f"the declared floor starts and exposes {len(tools)} tools")
          PY
