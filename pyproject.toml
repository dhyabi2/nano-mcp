[project]
name = "nano-mcp"
version = "0.1.0"
description = "MCP server + SDK so any AI agent can hold XNO (Nano) and pay per API call, transacting through rpc.nano.to."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
    "ed25519-blake2b-fork>=1.4",
    # 2.0.0, not 1.0: `mcp.server.mcpserver` - which server.py and paidtool.py
    # import - arrived with mcp 2.0.0, where the SDK renamed FastMCP to
    # MCPServer. No 1.x release carries that module, so `mcp>=1.0` let a
    # resolver satisfy this package with a version that cannot import it, and
    # in an environment already holding mcp 1.x it installed nothing and the
    # server raised ModuleNotFoundError on start. tests/test_dependency_floor.py
    # holds the floor.
    "mcp>=2.0.0",
]

# The command an MCP host or directory starts. Without it the only way in was
# `python -m nano_mcp.server`, which no registry entry can be expected to guess.
[project.scripts]
nano-mcp = "nano_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

# State the distribution's packages instead of relying on setuptools' flat-layout
# auto-discovery. Auto-discovery refuses to build when it finds more than one
# top-level directory that could be a package, and every non-source directory
# added at the root (audits/, and anything like it later) becomes one.
[tool.setuptools.packages.find]
include = ["nano_sdk*", "nano_mcp*"]
exclude = ["tests*", "audits*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit the live rpc.nano.to node"]